name: Compilar Gestor de Pedidos para Mac M1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-mac.yml'
      - 'main.js'
      - 'preload.js'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias reproducibles
        run: npm ci
      - name: Verificar guardado antes de compilar
        run: node --test tests/test_desktop_persistence.cjs
      - name: Crear instalador para Mac M1
        run: npx electron-builder --mac dmg zip --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'false'
      - name: Guardar instalador y copia ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Gestor-de-Pedidos-Mac-M1-0.5.1
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 30
