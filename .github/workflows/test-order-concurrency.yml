name: Verificar pedidos simultaneos

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sqlite-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Verificar inicio Gunicorn con cuatro hilos
        run: DB_PATH=/tmp/pedidos-smoke.db gunicorn -c gunicorn.conf.py --check-config app:app
      - name: Probar recepcion y reintentos (base temporal)
        run: python -m unittest discover -s tests -v
