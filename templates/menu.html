<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haz tu pedido</title><style>body{font-family:system-ui;background:#f6f4ef;margin:0;color:#222}.w{max-width:720px;margin:auto;padding:22px}h1{font-size:32px}.card{background:#fff;padding:16px;margin:10px 0;border-radius:16px;box-shadow:0 2px 12px #0001}.prod{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center}.price{font-weight:800}input,select,textarea,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:5px 0}input[type=number]{width:75px}button{background:#111;color:#fff;font-weight:800;font-size:17px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.two{grid-template-columns:1fr}}</style></head><body><div class=w><h1>🍔 Haz tu pedido</h1><p>Elige lo que quieres y envíanos tu pedido.</p><form method=post action=/ordenar>{% for p in productos %}<div class="card prod"><div><b>{{p.nombre}}</b><br><small>{{p.tipo}}</small>{% if p.descripcion %}<br><small>{{p.descripcion}}</small>{% endif %}</div><div class=price>{{p.precio|money}}</div><input type=number min=0 value=0 name=q_{{p.id}}></div>{% endfor %}<div class=card><h2>Tus datos</h2><div class=two><input required name=cliente placeholder="Nombre"><input required name=telefono placeholder="WhatsApp / teléfono"></div><div class=two><select name=entrega><option>Retiro</option><option>Delivery</option></select><select name=pago><option>Efectivo</option><option>Transferencia</option><option>Tarjeta al entregar</option></select></div><input name=direccion placeholder="Dirección (si es delivery)"><textarea name=notas placeholder="Observaciones: sin pepinillos, extra salsa, etc." style="box-sizing:border-box;width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:5px 0;min-height:80px"></textarea><button>CONFIRMAR PEDIDO</button></div></form></div></body></html>
